<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ParcelPro Admin Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="login">

        <h2>Admin Login</h2>

        <form id="loginForm">

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Username"
                autocomplete="username"
                required
            >

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p id="loginMessage"></p>

        <p>
            <a href="index.html">
                Back to Home
            </a>
        </p>

    </section>

    <script src="script.js"></script>

</body>
</html>
